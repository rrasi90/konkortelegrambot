name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck, Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      # The PDF guard compares against origin/main; fetch full history so the base ref exists.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npm run audit:client-bundle
      - run: npm run ael:pdf:check  # AEL-313: no PDF may enter commits
      - run: npx tsx scripts/engine-parity-harness.mts
      - run: npm run validate:content
      - run: npm run audit:exam-bank  # پوشش، ساختار و تطبیق کلید بانک سؤال آزمون‌ها
      - run: npm run validate:learning
      - run: npm run build:worker
      - run: npm run audit:miniapp
      - run: npm run build:offline
      - run: npm run audit:offline  # R-036/m4 §3.5: offline output must contain zero keys
      - name: Validate Wrangler bundle without deploying
        run: npx --yes wrangler deploy --dry-run --config apps/worker/wrangler.jsonc

  database:
    name: Database Migrations & Integrity Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ael
          POSTGRES_PASSWORD: ael
          POSTGRES_DB: ael_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AEL_DISPOSABLE_DB: "1"
      DATABASE_URL: postgres://ael:ael@127.0.0.1:5432/ael_test
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh
