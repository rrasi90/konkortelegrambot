name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck, Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx tsx scripts/engine-parity-harness.mts
      - run: npm run validate:content

  database:
    name: Database Migrations & Integrity Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ael
          POSTGRES_PASSWORD: ael
          POSTGRES_DB: ael_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ael:ael@localhost:5432/ael_test
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh
