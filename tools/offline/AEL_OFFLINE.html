<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>AEL | آزمون آفلاین مدیریت مالی</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:#eef5f3;color:#172b3b}
main{max-width:760px;margin:auto;padding:18px clamp(12px,4vw,30px) 40px}

.learn-app {
  --learn-ink: #172b3b;
  --learn-muted: #466073;
  --learn-paper: #fff;
  --learn-line: #c9d9df;
  --learn-accent: #086454;
  --learn-tint: #e9f6f1;
  display: grid;
  gap: 12px;
  color: var(--learn-ink);
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.learn-app[hidden] { display: none; }
.learn-heading { padding: 10px 2px 4px; }
.learn-heading h2, .learn-card h3, .learn-feedback h3 { margin: 0 0 .4rem; line-height: 1.45; color: var(--learn-ink); }
.learn-heading h2 { font-size: clamp(1.3rem, 5vw, 1.8rem); }
.learn-app p { margin: .35rem 0 .65rem; }
.learn-eyebrow { font-size: .85rem; font-weight: 700; color: var(--learn-accent); }
.learn-muted { color: var(--learn-muted); }
.learn-card { min-width: 0; padding: clamp(12px, 3vw, 19px); border: 1px solid var(--learn-line); border-radius: 16px; background: var(--learn-paper); }
.learn-app ul, .learn-app ol { padding-inline-start: 1.4rem; }
.learn-app li + li { margin-block-start: .4rem; }
.learn-note, .learn-warning { background: var(--learn-tint); border-inline-start: 4px solid var(--learn-accent); padding: .6rem .8rem; border-radius: 8px; }
.learn-warning { background: #fff1e7; border-color: #a74315; color: #712c0c; }
.learn-formula { padding: .6rem .8rem; border-radius: 8px; background: #edf2f7; font-family: ui-monospace, monospace; }
.learn-app .learn-button {
  color: var(--learn-ink); background: var(--learn-paper); border: 1px solid var(--learn-line);
  border-radius: 10px; padding: .54rem .82rem; min-height: 44px; margin: .25rem 0 .25rem .35rem;
  cursor: pointer; font: inherit; font-weight: 600; text-align: right; max-width: 100%;
}
.learn-app .learn-primary { color: #fff; background: var(--learn-accent); border-color: var(--learn-accent); }
.learn-app .learn-button:disabled { opacity: .54; cursor: default; }
.learn-app .learn-button:focus-visible, .learn-app a:focus-visible, .learn-app summary:focus-visible,
.learn-app textarea:focus-visible { outline: 3px solid #0d7c99; outline-offset: 2px; }
.learn-app .learn-topic, .learn-app .learn-option { width: 100%; display: block; }
.learn-app [hidden] { display: none !important; }
.learn-app .learn-option[aria-pressed="true"], .learn-app .learn-answered { background: var(--learn-tint); border-color: var(--learn-accent); }
.learn-options, .learn-actions { display: grid; gap: .35rem; }
.learn-actions { grid-template-columns: repeat(auto-fit, minmax(min(100%, 155px), 1fr)); }
.learn-question-grid { display: flex; flex-wrap: wrap; gap: .25rem; margin: .4rem 0; }
.learn-question-grid .learn-button { min-width: 44px; text-align: center; }
.learn-question-grid [aria-current="step"] { border: 2px solid #0d7c99; }
.learn-clock, .learn-score { font-weight: 700; }
.learn-feedback { border-block-start: 1px solid var(--learn-line); margin-block: .75rem; padding-block: .75rem .25rem; }
.learn-feedback .learn-result-correct { color: #126245; }
.learn-feedback .learn-result-incorrect { color: #9e321f; }
.learn-feedback .learn-result-skipped { color: #5d526e; }
.learn-details { padding: .45rem 0; }
.learn-details summary { cursor: pointer; font-weight: 700; min-height: 34px; }
.learn-address, .learn-source-list a { display: block; font-size: .85rem; }
.learn-issue textarea { width: 100%; display: block; min-height: 76px; resize: vertical; font: inherit; margin-block: .4rem; }
@media (min-width: 500px) {
  .learn-heading { padding-top: 12px; }
}

</style>
</head>
<body>
<main id="offline-root" aria-label="نسخهٔ آزمون آفلاین"></main>
<script>(() => {
  // apps/miniapp/learning.js
  (function() {
    "use strict";
    const day = 864e5;
    const fa = new Intl.NumberFormat("fa-IR");
    const digits = (value) => fa.format(value);
    const labels = {
      practice: "\u062A\u0645\u0631\u06CC\u0646 \u0622\u0645\u0648\u0632\u0634\u06CC",
      diagnostic: "\u0633\u0646\u062C\u0634 \u0634\u0631\u0648\u0639",
      timed: "\u0622\u0632\u0645\u0648\u0646 \u0632\u0645\u0627\u0646\u200C\u062F\u0627\u0631",
      correct: "\u062F\u0631\u0633\u062A",
      incorrect: "\u0646\u0627\u062F\u0631\u0633\u062A",
      skipped: "\u0646\u0632\u062F\u0647",
      pending: "\u062F\u0631 \u0627\u0646\u062A\u0638\u0627\u0631 \u0627\u0631\u0632\u06CC\u0627\u0628\u06CC"
    };
    function element(tag, text, cls) {
      const node = document.createElement(tag);
      if (text != null) node.textContent = text;
      if (cls) node.className = cls;
      return node;
    }
    function mathParagraph(text) {
      const paragraph = element("p");
      const arithmetic = /[−-]?[0-9۰-۹٠-٩][0-9۰-۹٠-٩٫.,٪%²³]*(?:\s*[+×÷=−*]\s*[−-]?[0-9۰-۹٠-٩][0-9۰-۹٠-٩٫.,٪%²³]*)+/g;
      let offset = 0;
      for (const match of text.matchAll(arithmetic)) {
        paragraph.append(text.slice(offset, match.index));
        const expression = element("bdi", match[0]);
        expression.dir = "ltr";
        paragraph.append(expression);
        offset = match.index + match[0].length;
      }
      paragraph.append(text.slice(offset));
      return paragraph;
    }
    function button(text, action, handler, style = "") {
      const node = element("button", text, "learn-button " + style);
      node.type = "button";
      node.dataset.action = action;
      node.addEventListener("click", handler);
      return node;
    }
    function details(title, child) {
      const node = element("details", null, "learn-details");
      node.append(element("summary", title), child);
      return node;
    }
    function initialState() {
      return { studied: [], reviews: {}, active: null, issues: [] };
    }
    function mount(root, api, options = {}) {
      const offline = options.offline === true;
      let scope = options.scope || "local";
      let data;
      let course;
      let screen = "hub";
      let selectedTopic;
      let selectedBlock = null;
      let selectedTopics = [];
      let builderCount = "6";
      let builderMode = "practice";
      let builderKind = "";
      let quotaEnabled = false;
      let quotaValues = {};
      let lessonReturn = "course";
      let busy = false;
      let warning = "";
      let timer;
      let pending;
      let storageUnavailable = false;
      let generation = 0;
      let state = read();
      function storageKey() {
        return "ael.learning.v1." + scope;
      }
      function read() {
        try {
          const raw = JSON.parse(localStorage.getItem(storageKey()) || "null");
          if (raw && Array.isArray(raw.studied) && Array.isArray(raw.issues) && raw.reviews && typeof raw.reviews === "object" && !Array.isArray(raw.reviews)) {
            if (raw.active && (!Array.isArray(raw.active.questions) || !raw.active.challenge || !raw.active.answers || !raw.active.results || !Array.isArray(raw.active.marked))) raw.active = null;
            return raw;
          }
        } catch {
          storageUnavailable = true;
        }
        return initialState();
      }
      function save() {
        try {
          localStorage.setItem(storageKey(), JSON.stringify(state));
        } catch {
          storageUnavailable = true;
        }
      }
      function heading(title, subtitle) {
        const header = element("header", null, "learn-heading");
        header.append(element("p", offline ? "\u0622\u0632\u0645\u0627\u06CC\u0634 \u0622\u0641\u0644\u0627\u06CC\u0646 AEL" : "\u0645\u0633\u06CC\u0631 \u06CC\u0627\u062F\u06AF\u06CC\u0631\u06CC AEL", "learn-eyebrow"), element("h2", title));
        if (subtitle) header.append(element("p", subtitle, "learn-muted"));
        root.append(header);
      }
      function go(next) {
        warning = "";
        if (next !== "lesson") selectedBlock = null;
        screen = next;
        render();
        const block = next === "lesson" && selectedBlock && [...root.querySelectorAll("[data-learning-block]")].find((node) => node.dataset.learningBlock === selectedBlock);
        (block || root.querySelector("h2"))?.focus();
        block?.scrollIntoView({ block: "center" });
      }
      function card(parent = root) {
        const box = element("section", null, "learn-card");
        parent.append(box);
        return box;
      }
      function mainButton(title, action, handler) {
        return button(title, action, handler, "learn-primary");
      }
      function routeButton() {
        return button("\u0628\u0627\u0632\u06AF\u0634\u062A \u0628\u0647 \u0645\u0633\u06CC\u0631", "course", () => go(course ? "course" : "hub"));
      }
      function active() {
        return state.active;
      }
      function topicFor(id) {
        return course?.topics.find((topic) => topic.id === id);
      }
      function incorrectQuestionIds(topicId) {
        return Object.keys(state.reviews).filter((id) => {
          const review = state.reviews[id];
          if (!review || review.courseId !== course.id || review.status !== "incorrect") return false;
          const topic = review.topicId || data.questionIndex?.entries.find((item) => item.id === id && item.sourceType === "authored" && item.courseId === course.id)?.topicId;
          return topic === topicId;
        });
      }
      function normalizeSearch(value) {
        return value.toLocaleLowerCase("fa").replace(/ي/g, "\u06CC").replace(/ك/g, "\u06A9").replace(/[۰-۹]/g, (digit) => String("\u06F0\u06F1\u06F2\u06F3\u06F4\u06F5\u06F6\u06F7\u06F8\u06F9".indexOf(digit))).replace(/[٠-٩]/g, (digit) => String("\u0660\u0661\u0662\u0663\u0664\u0665\u0666\u0667\u0668\u0669".indexOf(digit))).replace(/[\u200c\s]+/g, " ").trim();
      }
      function hasReviewed(id) {
        return state.reviews[id]?.attempts > 0;
      }
      function findNextTopic() {
        return course.topics.find((topic) => !state.studied.includes(topic.id) && topic.prerequisites.every((id) => state.studied.includes(id))) || course.topics[0];
      }
      function sources(ids) {
        const list = element("ul", null, "learn-source-list");
        for (const id of ids || []) {
          const source = course?.sources.find((item2) => item2.id === id);
          if (!source) continue;
          const item = element("li");
          item.append(element("span", source.title + " \xB7 " + source.locator));
          if (!offline) {
            const url = new URL(source.url);
            if (url.protocol === "https:") {
              const link = element("a", "\u0628\u0627\u0632 \u06A9\u0631\u062F\u0646 \u0645\u0646\u0628\u0639");
              link.href = url.href;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              item.append(link);
            }
          } else {
            const address = element("span", source.url, "learn-address");
            address.dir = "ltr";
            item.append(address);
          }
          list.append(item);
        }
        if (!list.children.length) list.append(element("li", "\u0627\u0631\u062C\u0627\u0639 \u062A\u06A9\u0645\u06CC\u0644\u06CC \u0628\u0631\u0627\u06CC \u0627\u06CC\u0646 \u0645\u0648\u0631\u062F \u062B\u0628\u062A \u0646\u0634\u062F\u0647 \u0627\u0633\u062A."));
        return list;
      }
      function renderHub() {
        heading("\u0627\u0632 \u06CC\u06A9 \u062F\u0631\u0633 \u06A9\u0648\u062A\u0627\u0647 \u0634\u0631\u0648\u0639 \u06A9\u0646", "\u06CC\u06A9 \u0645\u0628\u062D\u062B\u060C \u06CC\u06A9 \u0645\u062B\u0627\u0644 \u0648 \u0686\u0646\u062F \u062A\u0633\u062A. \u0645\u0633\u06CC\u0631 \u0631\u0627 \u0647\u0631 \u0632\u0645\u0627\u0646 \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u06CC \u0627\u062F\u0627\u0645\u0647 \u0628\u062F\u0647\u06CC.");
        if (offline) root.append(element("p", "\u0646\u0633\u062E\u0647\u0654 \u0634\u062E\u0635\u06CC \u0628\u0627 \u062A\u0645\u0631\u06CC\u0646 \u062A\u0623\u0644\u06CC\u0641\u06CC. \u06A9\u0627\u0631\u06A9\u0631\u062F \u0648 \u06AF\u0632\u0627\u0631\u0634 \u0627\u06CC\u0631\u0627\u062F \u0631\u0648\u06CC \u0647\u0645\u06CC\u0646 \u062F\u0633\u062A\u06AF\u0627\u0647 \u0630\u062E\u06CC\u0631\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F.", "learn-note"));
        for (const item of data.courses) {
          const box = card();
          box.append(
            element("h3", item.title),
            element("p", item.description, "learn-muted"),
            mainButton("\u0628\u0627\u0632 \u06A9\u0631\u062F\u0646 \u0645\u0633\u06CC\u0631", "open-course", () => {
              course = item;
              go("course");
            })
          );
        }
        root.append(button("\u0627\u0644\u06AF\u0648\u0647\u0627\u06CC \u0633\u0624\u0627\u0644 \u062F\u0631 \u062F\u0647 \u062F\u0648\u0631\u0647", "recurrence", () => go("recurrence")));
        if (data.questionIndex) root.append(button("\u0634\u0646\u0627\u0633\u0646\u0627\u0645\u0647\u0654 \u0633\u0624\u0627\u0644\u200C\u0647\u0627\u06CC \u0645\u0648\u062C\u0648\u062F", "question-index", () => go("questionIndex")));
        root.append(button("\u06AF\u0632\u0627\u0631\u0634 \u0627\u06CC\u0631\u0627\u062F\u0647\u0627\u06CC \u062B\u0628\u062A\u200C\u0634\u062F\u0647", "issues", () => go("issues")));
        if (offline) root.append(button("\u067E\u0634\u062A\u06CC\u0628\u0627\u0646\u200C\u06AF\u06CC\u0631\u06CC \u0648 \u0628\u0627\u0632\u06CC\u0627\u0628\u06CC", "backup", () => go("backup")));
      }
      function renderCourse() {
        heading(course.title, course.scopeNote);
        const next = findNextTopic();
        const route = card();
        const completed = course.topics.filter((topic) => state.studied.includes(topic.id)).length;
        route.append(
          element("p", digits(completed) + " \u0627\u0632 " + digits(course.topics.length) + " \u062F\u0631\u0633 \u0645\u0637\u0627\u0644\u0639\u0647 \u0634\u062F\u0647", "learn-eyebrow"),
          element("h3", completed === course.topics.length ? "\u06CC\u06A9 \u0645\u0631\u0648\u0631 \u06A9\u0648\u062A\u0627\u0647" : "\u06AF\u0627\u0645 \u067E\u06CC\u0634\u0646\u0647\u0627\u062F\u06CC"),
          element("p", next.title + " \xB7 \u062D\u062F\u0648\u062F " + digits(next.minutes) + " \u062F\u0642\u06CC\u0642\u0647"),
          mainButton("\u0631\u0641\u062A\u0646 \u0628\u0647 \u062F\u0631\u0633", "next-lesson", () => {
            selectedTopic = next;
            lessonReturn = "course";
            go("lesson");
          })
        );
        const actions = element("div", null, "learn-actions");
        const diagnosticCount = Math.min(course.topics.length, 12);
        const timedCount = Math.min(course.questionCount, 6);
        actions.append(
          button("\u0633\u0646\u062C\u0634 \u0634\u0631\u0648\u0639 \xB7 " + digits(diagnosticCount) + " \u062A\u0633\u062A", "diagnostic", () => begin("diagnostic", void 0, void 0, diagnosticCount)),
          button("\u0622\u0632\u0645\u0648\u0646 \u0632\u0645\u0627\u0646\u200C\u062F\u0627\u0631 \xB7 " + digits(timedCount) + " \u062A\u0633\u062A", "timed", () => begin("timed", void 0, void 0, timedCount)),
          button("\u0633\u0627\u062E\u062A \u0622\u0632\u0645\u0648\u0646 \u062F\u0644\u062E\u0648\u0627\u0647", "custom-exam", () => {
            selectedTopics = course.topics.map((topic) => topic.id);
            builderCount = "6";
            builderMode = "practice";
            builderKind = "";
            quotaEnabled = false;
            quotaValues = {};
            go("builder");
          }),
          button("\u0645\u0631\u0648\u0631 \u0627\u0634\u062A\u0628\u0627\u0647\u200C\u0647\u0627 \u0648 \u0646\u0634\u0627\u0646\u200C\u0647\u0627", "review", () => go("review"))
        );
        if (active()?.challenge.courseId === course.id && active().challenge.version === course.version && !active().summary) {
          actions.prepend(mainButton("\u0627\u062F\u0627\u0645\u0647\u0654 \u062C\u0644\u0633\u0647\u0654 \u0642\u0628\u0644\u06CC", "resume", () => go("quiz")));
        }
        root.append(actions);
        const topicList = card();
        topicList.append(element("h3", "\u062F\u0631\u0633\u200C\u0647\u0627\u06CC \u06A9\u0648\u062A\u0627\u0647"));
        const searchLabel = element("label", "\u062C\u0633\u062A\u200C\u0648\u062C\u0648 \u062F\u0631 \u062F\u0631\u0633\u200C\u0647\u0627 ");
        const search = element("input");
        search.type = "search";
        search.placeholder = "\u0646\u0627\u0645 \u0645\u0628\u062D\u062B \u06CC\u0627 \u0645\u0641\u0647\u0648\u0645";
        searchLabel.append(search);
        const sourceLabel = element("label", "\u0627\u0646\u062A\u062E\u0627\u0628 \u0645\u0631\u062C\u0639 \u0648 \u0628\u062E\u0634 ");
        const sourceFilter = element("select");
        sourceFilter.dataset.action = "filter-learning-source";
        const allSources = element("option", "\u0647\u0645\u0647\u0654 \u0645\u0631\u0627\u062C\u0639");
        allSources.value = "";
        sourceFilter.append(allSources);
        for (const source of course.sources) {
          if (!course.topics.some((topic) => (topic.sourceIds || []).includes(source.id))) continue;
          const option = element("option", source.title + " \xB7 " + source.locator);
          option.value = source.id;
          sourceFilter.append(option);
        }
        sourceLabel.append(sourceFilter);
        const matches = element("div");
        const empty = element("p", "\u0645\u0628\u062D\u062B\u06CC \u0628\u0627 \u0627\u06CC\u0646 \u062C\u0633\u062A\u200C\u0648\u062C\u0648 \u0648 \u0645\u0631\u062C\u0639 \u067E\u06CC\u062F\u0627 \u0646\u0634\u062F.", "learn-muted");
        empty.hidden = true;
        topicList.append(searchLabel, sourceLabel, matches, empty);
        for (const topic of course.topics) {
          const wrongCount = incorrectQuestionIds(topic.id).length;
          const title = topic.title + (state.studied.includes(topic.id) ? " \xB7 \u0645\u0637\u0627\u0644\u0639\u0647 \u0634\u062F" : "") + (wrongCount ? " \xB7 " + digits(wrongCount) + " \u067E\u0627\u0633\u062E \u0646\u0627\u062F\u0631\u0633\u062A \u0628\u0631\u0627\u06CC \u0645\u0631\u0648\u0631" : "");
          const item = button(title, "topic-" + topic.id, () => {
            selectedTopic = topic;
            lessonReturn = "course";
            go("lesson");
          }, "learn-topic");
          const topicSources = course.sources.filter((source) => (topic.sourceIds || []).includes(source.id));
          item.dataset.search = normalizeSearch([
            topic.title,
            topic.objective,
            ...topic.concepts,
            ...topicSources.flatMap((source) => [source.title, source.locator])
          ].join(" "));
          item.dataset.sourceIds = JSON.stringify(topic.sourceIds || []);
          matches.append(item);
        }
        function filterTopics() {
          const query = normalizeSearch(search.value);
          let visible = 0;
          for (const item of matches.children) {
            item.hidden = !item.dataset.search.includes(query) || sourceFilter.value !== "" && !JSON.parse(item.dataset.sourceIds).includes(sourceFilter.value);
            if (!item.hidden) visible++;
          }
          empty.hidden = visible !== 0;
        }
        search.addEventListener("input", filterTopics);
        sourceFilter.addEventListener("change", filterTopics);
        root.append(button("\u0628\u0627\u0632\u06AF\u0634\u062A \u0628\u0647 \u062F\u0631\u0633\u200C\u0647\u0627", "hub", () => go("hub")));
      }
      function renderLesson() {
        const topic = selectedTopic;
        heading(topic.title, topic.objective);
        const box = card();
        const missing = topic.prerequisites.map(topicFor).find((t) => t && !state.studied.includes(t.id));
        if (missing) box.append(button("\u067E\u06CC\u0634\u200C\u0646\u06CC\u0627\u0632 \u067E\u06CC\u0634\u0646\u0647\u0627\u062F\u06CC: " + missing.title, "prerequisite", () => {
          selectedTopic = missing;
          selectedBlock = null;
          go("lesson");
        }));
        box.append(element("h3", "\u0633\u0647 \u0646\u06A9\u062A\u0647 \u0628\u0631\u0627\u06CC \u062D\u0644"));
        const list = element("ol");
        topic.concepts.forEach((concept, index) => {
          const item = element("li", concept);
          item.tabIndex = -1;
          item.dataset.learningBlock = "concept:" + index;
          list.append(item);
